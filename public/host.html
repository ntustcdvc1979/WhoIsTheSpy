<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>主持台 · 誰是臥底</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-host">
  <div class="meander"></div>
  <header class="topbar">
    <div class="brand">
      <div class="seal">主持</div>
      <div>
        <h1 class="brand-title">誰是臥底</h1>
        <nav class="host-nav" data-host-only hidden>
          <a href="host.html" class="active">主控台</a>
          <a href="questions.html">題目設計</a>
        </nav>
      </div>
    </div>
    <div class="row" id="userBox" hidden>
      <span class="muted" id="userName"></span>
      <button class="btn ghost small" id="btnSignOut">登出</button>
    </div>
  </header>

  <main class="wrap">
    <section data-view="loading"><p class="muted">研墨中……</p></section>

    <!-- 登入 -->
    <section data-view="login" hidden>
      <div class="card" style="max-width:440px;margin:40px auto;text-align:center">
        <div class="seal big" style="margin-bottom:14px">主</div>
        <h2>主持人請登入</h2>
        <p class="muted">需使用 Google 帳號登入才能設定題目與開始遊戲</p>
        <button class="btn red block" id="btnGoogle">以 Google 帳號登入</button>
        <p id="loginHint" hidden style="margin:14px 0 0;padding:10px;background:var(--paper-2);border-left:3px solid var(--cinnabar);text-align:left;font-size:.9rem"></p>
      </div>
    </section>

    <!-- 非白名單 -->
    <section data-view="denied" hidden>
      <div class="card" style="max-width:440px;margin:40px auto;text-align:center">
        <h2>無法使用主控台</h2>
        <p class="muted" id="deniedReason">此帳號不在主持人白名單內。</p>
      </div>
    </section>

    <!-- 主控台 -->
    <section data-view="dash" hidden>
      <div class="status-strip">
        <div>
          <div class="muted" style="color:#9fb3d1">全場狀態</div>
          <div class="code" style="font-size:1.6rem;letter-spacing:.2em" id="statusText">待命中</div>
        </div>
        <div style="text-align:center">
          <div class="muted" style="color:#9fb3d1">倒數</div>
          <div class="timer" id="hostTimer">–:––</div>
        </div>
        <div class="row">
          <a class="btn ghost small" style="color:var(--paper);border-color:#9fb3d1" href="screen.html" target="_blank">開投影幕</a>
          <a class="btn ghost small" style="color:var(--paper);border-color:#9fb3d1" href="player.html" target="_blank">玩家頁</a>
        </div>
      </div>

      <div class="grid-2">
        <div>
          <!-- 全場控制 -->
          <div class="card">
            <div class="card-title">全場控制（所有桌）</div>
            <div class="row" style="margin-bottom:10px;align-items:flex-end">
              <div class="grow">
                <label>下一輪</label>
                <div style="font-size:1.4rem;letter-spacing:.2em" id="nextRound">第一輪</div>
                <div class="muted" style="font-size:.85rem">每一桌各自隨機出題，同一桌不會重複</div>
              </div>
              <div style="width:130px">
                <label for="inpDuration">倒數（秒）</label>
                <input type="number" id="inpDuration" min="10" max="3600" step="10" value="180">
              </div>
            </div>
            <div class="row" style="margin-bottom:14px">
              <button class="btn ghost small" data-dur="60">1 分</button>
              <button class="btn ghost small" data-dur="120">2 分</button>
              <button class="btn ghost small" data-dur="180">3 分</button>
              <button class="btn ghost small" data-dur="300">5 分</button>
            </div>
            <button class="btn red block" id="btnStartAll" style="font-size:1.4rem;padding:18px">所有桌一起開始</button>
            <div class="row" style="margin-top:10px">
              <button class="btn blue grow" id="btnRevealAll">全部揭曉臥底</button>
              <button class="btn ghost grow" id="btnLobbyAll">全部回到待命</button>
            </div>
            <p class="muted" id="ctrlHint" style="margin:10px 0 0"></p>
            <div class="row" style="justify-content:flex-end;margin-top:8px">
              <button class="btn ghost small" id="btnResetRounds">重置輪次（新的一場）</button>
            </div>
          </div>

          <!-- 桌列表 -->
          <div class="card">
            <div class="card-title">桌 <span class="muted" id="roomCount"></span></div>
            <ul class="group-list" id="roomList"></ul>
            <p class="muted" id="roomEmpty">還沒有任何一桌。玩家掃投影幕 QR Code 後可自行建立，或在下方新增。</p>
            <div class="row" style="margin-top:12px">
              <input type="text" id="inpRoomName" class="grow" maxlength="12" placeholder="新桌名，例：第一桌" style="width:auto">
              <button class="btn" id="btnCreateRoom">新增一桌</button>
            </div>
          </div>
        </div>

        <div>
          <!-- 桌詳情 -->
          <div class="card" id="roomDetail" hidden>
            <div class="card-title"><span id="detailName"></span> <span class="muted" id="detailMeta"></span></div>
            <ul class="group-list" id="groupList"></ul>
            <p class="muted" id="groupEmpty">這一桌還沒有玩家。</p>
            <div class="row" style="justify-content:flex-end;margin-top:10px">
              <button class="btn ghost small" id="btnClearGroups">清空此桌玩家</button>
              <button class="btn ghost small" id="btnDeleteRoom">刪除此桌</button>
            </div>
          </div>

          <!-- 題目預覽 -->
          <div class="card">
            <div class="card-title">本場題目 <span class="grow"></span><a class="btn ghost small" href="questions.html">編輯題目</a></div>
            <ul class="q-preview" id="qPreview"></ul>
            <p class="muted" id="qNote" style="margin:10px 0 0"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/host.js"></script>
</body>
</html>
