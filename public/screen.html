<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投影幕 · 誰是臥底</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="page-screen">
  <div class="screen">
    <div class="meander"></div>
    <header class="screen-head">
      <div class="brand">
        <div class="seal">臥底</div>
        <h1 class="brand-title">誰是臥底</h1>
      </div>
      <div class="screen-credit" id="screenStatus"></div>
    </header>

    <main class="screen-main">
      <!-- 祥雲裝飾 -->
      <svg class="cloud-deco tl" viewBox="0 0 200 100" aria-hidden="true"><g fill="none" stroke="#f4ecd8" stroke-width="4" stroke-linecap="round"><path d="M20 80c-14 0-14-22 2-22 0-20 30-24 36-6 6-22 44-20 44 4 16-6 30 6 22 20H20z"/><path d="M52 66c0-8 12-8 12 0s-10 8-10 2"/><path d="M90 64c0-10 16-10 16 0s-12 10-12 2"/><path d="M130 80c40 0 60-10 60-30"/></g></svg>
      <svg class="cloud-deco br" viewBox="0 0 200 100" aria-hidden="true"><g fill="none" stroke="#f4ecd8" stroke-width="4" stroke-linecap="round"><path d="M20 80c-14 0-14-22 2-22 0-20 30-24 36-6 6-22 44-20 44 4 16-6 30 6 22 20H20z"/><path d="M52 66c0-8 12-8 12 0s-10 8-10 2"/><path d="M90 64c0-10 16-10 16 0s-12 10-12 2"/><path d="M130 80c40 0 60-10 60-30"/></g></svg>

      <section data-view="loading"><p style="color:var(--s-dim)">研墨中……</p></section>

      <!-- 待命：玩家掃碼（客） -->
      <section data-view="lobby" hidden class="lobby solo">
        <div class="qr-card">
          <div id="qr"></div>
          <div class="qr-glyph">客・掃碼加入</div>
          <div class="qr-url" id="qrUrl"></div>
        </div>
        <div>
          <h2>誰是臥底</h2>
          <div class="sub">手機掃描左側 QR Code</div>
          <div class="sub">選擇或建立你們這一桌・再建立或加入組別</div>
          <div class="sub" style="margin-top:4vh;color:var(--s-fg)">待命中・等待主持人開始</div>
        </div>
      </section>

      <!-- 倒數 -->
      <section data-view="playing" hidden class="countdown-wrap">
        <div class="round-label" id="roundLabel"></div>
        <div class="ring" id="ring">
          <svg viewBox="0 0 200 200">
            <defs>
              <filter id="brush" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
                <feDisplacementMap in="SourceGraphic" scale="3"/>
              </filter>
            </defs>
            <circle class="track" cx="100" cy="100" r="88" fill="none" stroke-width="10"/>
            <circle class="bar" id="ringBar" cx="100" cy="100" r="88" fill="none" stroke-width="10" stroke-linecap="round" filter="url(#brush)"/>
          </svg>
          <div class="num" id="countNum"></div>
        </div>
        <div class="timeup" id="timeUp" hidden>時間到</div>
      </section>

      <!-- 揭曉 -->
      <section data-view="revealed" hidden class="reveal">
        <div class="label" id="revealLabel">答案揭曉</div>
        <div><span class="spy-name">請看手機</span></div>
        <p class="sub" style="color:var(--s-dim);letter-spacing:.2em;font-size:clamp(1.2rem,2.4vw,2rem)">各桌題目不同・手機上會顯示你們是不是臥底，以及本桌的兩個詞</p>
      </section>
    </main>

    <div class="meander"></div>
  </div>
  <button class="btn small fs-btn" id="btnFs">全螢幕</button>

  <script type="module" src="js/screen.js"></script>
</body>
</html>
