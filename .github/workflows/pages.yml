# 部署前端到 GitHub Pages
# Firebase 設定不放在 git，部署時由 Repository secrets 產生 public/js/firebase-config.js
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate firebase-config.js from secrets
        env:
          FB_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FB_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FB_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FB_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FB_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          for v in FB_API_KEY FB_AUTH_DOMAIN FB_PROJECT_ID FB_APP_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::缺少 Repository secret（$v），請到 Settings → Secrets and variables → Actions 設定"
              exit 1
            fi
          done
          node -e '
            const e = process.env;
            const cfg = {
              apiKey: e.FB_API_KEY,
              authDomain: e.FB_AUTH_DOMAIN,
              projectId: e.FB_PROJECT_ID,
              storageBucket: e.FB_STORAGE_BUCKET || "",
              messagingSenderId: e.FB_SENDER_ID || "",
              appId: e.FB_APP_ID,
            };
            require("fs").writeFileSync("public/js/firebase-config.js",
              "export const firebaseConfig = " + JSON.stringify(cfg, null, 2) + ";\n");
          '
          touch public/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
